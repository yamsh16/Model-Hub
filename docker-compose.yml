# Local development database. The backend runs on the host (see README); this only provides
# PostgreSQL. Day 28 extends this file to the whole stack.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modelhub
      POSTGRES_PASSWORD: modelhub   # development only; production uses DATABASE_URL
      POSTGRES_DB: modelhub
    ports:
      - "127.0.0.1:5432:5432"       # bound to localhost so it isn't exposed on your network
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelhub -d modelhub"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
