# The whole stack:  docker compose up -d --build --wait   ->  http://localhost:3000
# Only the database (for working on the code on the host):  docker compose up -d --wait db
#
# Everything is published on 127.0.0.1 only. Optional settings come from your shell or a .env
# file next to this one (see README "Run everything with Docker"); none are required.
name: ${COMPOSE_PROJECT_NAME:-model-hub}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modelhub
      POSTGRES_PASSWORD: modelhub   # development only; production uses DATABASE_URL
      POSTGRES_DB: modelhub
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"   # bound to localhost so it isn't exposed on your network
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelhub -d modelhub"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://modelhub:modelhub@db:5432/modelhub
      # Left empty, the API generates both once and keeps them in the `secrets` volume, so
      # sign-ins and stored API keys survive restarts. Set them to manage the keys yourself.
      JWT_SECRET: ${JWT_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      MODELHUB_ENV: ${MODELHUB_ENV:-}
      ALLOW_PRIVATE_ENDPOINTS: ${ALLOW_PRIVATE_ENDPOINTS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}}
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8001"
    volumes:
      - uploads:/data/uploads
      - secrets:/data/secrets
    # The API only needs to write to the two volumes above and /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped
    # No Docker socket is mounted: giving this container the socket would hand it root on the
    # host. So "run an uploaded model" is unavailable here and answers with a clear error;
    # it works when the API runs on the host (see README). Day 29 moves container control
    # into its own small service.

  web:
    build:
      context: ./web
      args:
        # Baked into the browser bundle: the address *your browser* uses to reach the API.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:${API_PORT:-8001}}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    restart: unless-stopped

volumes:
  dbdata:
  uploads:
  secrets:
